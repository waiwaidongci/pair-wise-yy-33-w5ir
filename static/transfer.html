<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>线路转供调度</title>
<style>
body{font:16px system-ui;max-width:1100px;margin:32px auto;padding:0 20px}
table{border-collapse:collapse;width:100%;margin:12px 0 28px}
td,th{border:1px solid #d0d7de;padding:6px 10px;text-align:left;font-size:14px}
th{background:#f3f5f7}
input,select{padding:6px;margin:2px 4px 2px 0}button{padding:8px 14px}
.bad{color:#b42318}.ok{color:#067647}.muted{color:#667085}
h2{margin-top:28px}
</style>
<h1>备用线路转供</h1>
<p class="muted">同一目标线路只留一笔待执行单，重复提交沿用首次结果；容量或转供内容变更后原许可失效并重算。<a href="/">返回恢复调度</a></p>

<h2>登记转供单</h2>
<div>
<input id="actor" placeholder="操作人" value="dispatcher-demo">
<select id="role"><option value="dispatcher">dispatcher</option><option value="field">field</option></select>
<select id="src"></select> → <select id="dst"></select>
<input id="load" type="number" step="0.1" min="0" placeholder="负荷 MW" style="width:100px">
<span id="users"></span>
<button onclick="submitOrder()">提交转供单</button>
</div>
<pre id="result" class="muted">提交后在此显示判定结果</pre>

<h2>线路剩余容量</h2>
<table id="lines"><thead><tr><th>线路</th><th>容量 MW</th><th>原有承接 MW</th><th>恢复预留 MW</th><th>剩余容量 MW</th><th>待执行单</th></tr></thead><tbody></tbody></table>

<h2>待执行单</h2>
<table id="pending"><thead><tr><th>#</th><th>源线路</th><th>目标线路</th><th>负荷 MW</th><th>重要用户</th><th>登记人</th><th>操作</th></tr></thead><tbody></tbody></table>

<h2>转供单存档</h2>
<table id="orders"><thead><tr><th>#</th><th>状态</th><th>源→目标</th><th>负荷 MW</th><th>判定</th><th>版本</th><th>时间</th></tr></thead><tbody></tbody></table>

<script>
const $=id=>document.getElementById(id);
const hdrs=()=>({"Content-Type":"application/json","X-Actor":$("actor").value,"X-Role":$("role").value});
async function api(path,opts){const r=await fetch(path,opts);const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);return d}
let lines=[],facilities=[];
const STATE={pending:"待执行",executed:"已执行",rejected:"已驳回",invalidated:"已失效",cancelled:"已取消"};

async function refresh(){
  const [ov,orders,st]=await Promise.all([api("/api/transfer-overview"),api("/api/transfer-orders"),api("/api/state")]);
  lines=ov.lines;facilities=st.facilities;
  const opts=lines.map(l=>`<option value="${l.line_id}">${l.code} ${l.name}</option>`).join("");
  $("src").innerHTML=opts;$("dst").innerHTML=opts;
  if(lines.length>1)$("dst").selectedIndex=1;
  renderUsers();
  $("lines").querySelector("tbody").innerHTML=lines.map(l=>{
    const p=l.pending_order;
    return `<tr><td>${l.code} ${l.name}</td><td>${l.capacity_mw}</td><td>${l.committed_mw}</td><td>${l.reserve_mw}</td>`+
      `<td class="${l.remaining_mw>0?"ok":"bad"}">${l.remaining_mw}</td>`+
      `<td>${p?`#${p.id} ${p.source_code}→${p.load_mw}MW`:"—"}</td></tr>`;
  }).join("");
  $("pending").querySelector("tbody").innerHTML=ov.pending_orders.map(o=>
    `<tr><td>#${o.id}</td><td>${o.source_code}</td><td>${o.target_code}</td><td>${o.load_mw}</td>`+
    `<td>${o.important_users.map(u=>u.name).join("、")||"—"}</td><td>${o.created_by}</td>`+
    `<td><button onclick="act(${o.id},'execute')">执行</button> <button onclick="act(${o.id},'cancel')">取消</button></td></tr>`
  ).join("")||`<tr><td colspan="7" class="muted">暂无待执行单</td></tr>`;
  $("orders").querySelector("tbody").innerHTML=orders.map(o=>
    `<tr><td>#${o.id}</td><td>${STATE[o.state]||o.state}</td><td>${o.source_code}→${o.target_code}</td><td>${o.load_mw}</td>`+
    `<td class="${o.decision.approved?"ok":"bad"}">${o.decision.approved?"准许":o.decision.reasons.join("；")}</td>`+
    `<td>v${o.revision}</td><td>${o.created_at}</td></tr>`
  ).join("")||`<tr><td colspan="7" class="muted">暂无存档</td></tr>`;
}
function renderUsers(){
  const sid=Number($("src").value);
  const us=facilities.filter(f=>f.asset_id===sid);
  $("users").innerHTML=us.map(f=>`<label><input type="checkbox" class="fu" value="${f.id}" data-name="${f.name}" data-p="${f.priority}" ${f.priority===1?"checked":""}>${f.name}(P${f.priority})</label>`).join("")||'<span class="muted">该线路无登记重要用户</span>';
}
$("src").addEventListener("change",renderUsers);
async function submitOrder(){
  const users=[...document.querySelectorAll(".fu:checked")].map(c=>({facility_id:Number(c.value),name:c.dataset.name,priority:Number(c.dataset.p)}));
  try{
    const o=await api("/api/transfer-orders",{method:"POST",headers:hdrs(),body:JSON.stringify({
      source_line_id:Number($("src").value),target_line_id:Number($("dst").value),load_mw:Number($("load").value),important_users:users})});
    $("result").className=o.state==="pending"?"ok":"bad";
    $("result").textContent=(o.reused?"重复提交，沿用首次结果：":"")+
      (o.state==="pending"?`准许执行（转供单 #${o.id}，剩余 ${o.decision.remaining_mw}MW）`:`驳回：${o.decision.reasons.join("；")}`);
  }catch(e){$("result").className="bad";$("result").textContent=e.message}
  refresh();
}
async function act(id,action){
  try{await api(`/api/transfer-orders/${id}/${action}`,{method:"POST",headers:hdrs(),body:"{}"})}catch(e){$("result").className="bad";$("result").textContent=e.message}
  refresh();
}
refresh();
</script>
